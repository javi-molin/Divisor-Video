
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortador de historias</title>

<style>
:root {
  --bg: #111116;
  --card: #1d1d25;
  --text: #f5f5f7;
  --muted: #a5a5b2;
  --accent: #b9a0ff;
  --border: #353541;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 { font-size: 27px; margin-bottom: 8px; }

p { color: var(--muted); line-height: 1.5; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}

input[type="file"] {
  width: 100%;
  margin: 18px 0;
}

button {
  background: var(--accent);
  color: #17121f;
  border: 0;
  padding: 13px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.video {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  background: black;
}

#status {
  margin-top: 18px;
  font-size: 14px;
  white-space: pre-wrap;
}

#stage {
  color: var(--accent);
  font-size: 13px;
  margin-top: 14px;
}

progress {
  width: 100%;
  height: 12px;
  margin-top: 12px;
  accent-color: var(--accent);
}

progress:indeterminate {
  appearance: none;
  background: #33333f;
  border-radius: 10px;
  overflow: hidden;
}

progress:indeterminate::-webkit-progress-bar {
  background: #33333f;
}

progress:indeterminate::-webkit-progress-value {
  background: var(--accent);
}

#percent {
  display: block;
  text-align: right;
  font-size: 14px;
  font-weight: bold;
  margin-top: 6px;
}

.part {
  border-top: 1px solid var(--border);
  padding: 16px 0;
}

.part strong { display: block; margin-bottom: 8px; }

.part a {
  color: var(--accent);
  display: inline-block;
  margin-top: 10px;
}

.small { font-size: 12px; }

#log {
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<main>
  <h1>✂️ Cortador de historias</h1>
  <p>
    Divide videos largos en clips de 1 minuto, sin perder escenas
    ni repetir contenido. Todo se procesa en tu dispositivo.
  </p>

  <section class="card">
    <label for="video"><strong>Selecciona tu video</strong></label>
    <input id="video" type="file" accept="video/*">

    <video id="preview" class="video" controls hidden></video>

    <p id="duration"></p>

    <button id="cut" disabled>Dividir video</button>

    <div id="stage"></div>
    <progress id="progress" value="0" max="100" hidden></progress>
    <span id="percent"></span>

    <div id="status"></div>
    <div id="log"></div>
  </section>

  <section id="results" class="card" hidden>
    <h2>Videos listos</h2>
    <p id="summary"></p>
    <button id="downloadAll">Descargar todas las partes (ZIP)</button>
    <div id="parts"></div>
  </section>

  <p class="small">
    Mantén esta página abierta mientras se procesan los videos.
    El tiempo depende del tamaño del archivo y de tu dispositivo.
  </p>
</main>

<script type="module">
import { FFmpeg } from
  "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import { fetchFile, toBlobURL } from
  "https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js";

import JSZip from
  "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";

const $ = id => document.getElementById(id);

const ffmpeg = new FFmpeg();

let selectedFile = null;
let duration = 0;
let parts = [];
let currentTask = null;

const formatTime = seconds => {
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

function updateProgress(value, message, stage) {
  const percent = Math.max(0, Math.min(100, value));

  $("progress").hidden = false;
  $("progress").removeAttribute("value");
  $("progress").value = percent;

  $("percent").textContent = `${Math.round(percent)}%`;
  $("status").textContent = message;
  $("stage").textContent = stage;

  $("progress").value = percent;
}

function addLog(message) {
  const time = new Date().toLocaleTimeString();
  $("log").textContent += `[${time}] ${message}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}

function setIndeterminate(message, stage, percent = "—") {
  $("progress").hidden = false;
  $("progress").removeAttribute("value");
  $("percent").textContent = percent;
  $("status").textContent = message;
  $("stage").textContent = stage;
}

function resetProgress() {
  $("progress").hidden = true;
  $("percent").textContent = "";
  $("status").textContent = "";
  $("stage").textContent = "";
  $("log").textContent = "";
}

$("video").addEventListener("change", async event => {
  selectedFile = event.target.files[0];

  if (!selectedFile) return;

  $("results").hidden = true;
  $("cut").disabled = true;
  resetProgress();

  $("status").textContent = "Leyendo información del video...";

  const url = URL.createObjectURL(selectedFile);
  $("preview").src = url;
  $("preview").hidden = false;

  await new Promise((resolve, reject) => {
    $("preview").onloadedmetadata = resolve;
    $("preview").onerror = reject;
  }).catch(() => {
    $("status").textContent = "No se pudo leer este video.";
  });

  duration = $("preview").duration;

  if (!Number.isFinite(duration)) {
    $("duration").textContent = "";
    return;
  }

  $("duration").textContent =
    `Duración: ${formatTime(duration)} · ` +
    `${Math.ceil(duration / 60)} partes`;

  $("cut").disabled = false;
  $("status").textContent = "";
});

ffmpeg.on("log", ({ message }) => {
  if (message) addLog(message);
});

ffmpeg.on("progress", ({ progress }) => {
  if (!currentTask || !Number.isFinite(progress)) return;

  const ratio = Math.max(0, Math.min(1, progress));

  const overall =
    currentTask.base +
    ratio * currentTask.weight;

  updateProgress(
    overall,
    `Codificando parte ${currentTask.index} de ${currentTask.total}...`,
    `División del video · Parte ${currentTask.index}/${currentTask.total}`
  );
});

$("cut").addEventListener("click", async () => {
  $("cut").disabled = true;
  $("video").disabled = true;
  $("results").hidden = true;

  resetProgress();
  parts = [];
  currentTask = null;

  try {
    // 1. Cargar el procesador
    if (!ffmpeg.loaded) {
      setIndeterminate(
        "Descargando y preparando el procesador de video. " +
        "Esta etapa puede tardar la primera vez.",
        "Etapa 1 de 4 · Preparando FFmpeg"
      );

      addLog("Iniciando carga de FFmpeg...");

      await ffmpeg.load({
        coreURL: await toBlobURL(
          "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js",
          "text/javascript"
        ),
        wasmURL:
          "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm"
      });

      addLog("Procesador de video listo.");
    }

    updateProgress(
      10,
      "Procesador listo.",
      "Etapa 1 de 4 · Preparación completada"
    );

    // 2. Preparar el archivo
    setIndeterminate(
      "Leyendo el video y preparándolo para dividirlo...",
      "Etapa 2 de 4 · Preparando archivo"
    );

    const input = "video_original";

    const data = await fetchFile(selectedFile);

    await ffmpeg.writeFile(input, data);

    updateProgress(
      15,
      "Video preparado. Comenzando la división...",
      "Etapa 2 de 4 · Archivo listo"
    );

    // 3. Dividir y codificar
    const total = Math.ceil(duration / 60);

    for (let i = 0; i < total; i++) {
      const start = i * 60;
      const length = Math.min(60, duration - start);

      const filename =
        `parte_${String(i + 1).padStart(2, "0")}.mp4`;

      const base = 15 + (i / total) * 80;
      const weight = 80 / total;

      currentTask = {
        index: i + 1,
        total,
        base,
        weight
      };

      updateProgress(
        base,
        `Iniciando parte ${i + 1} de ${total}...`,
        `Etapa 3 de 4 · División del video`
      );

      await ffmpeg.exec([
        "-ss", String(start),
        "-i", input,
        "-t", String(length),
        "-map", "0:v:0",
        "-map", "0:a:0?",
        "-c:v", "libx264",
        "-preset", "ultrafast",
        "-crf", "18",
        "-c:a", "aac",
        "-b:a", "192k",
        "-movflags", "+faststart",
        "-avoid_negative_ts", "make_zero",
        filename
      ]);

      const output = await ffmpeg.readFile(filename);

      parts.push({
        name: filename,
        data: output,
        start,
        duration: length
      });

      await ffmpeg.deleteFile(filename);

      updateProgress(
        base + weight,
        `Parte ${i + 1} de ${total} completada.`,
        `Etapa 3 de 4 · ${i + 1}/${total} partes listas`
      );
    }

    currentTask = null;

    await ffmpeg.deleteFile(input);

    // 4. Preparar resultados
    updateProgress(
      95,
      "Generando los enlaces de descarga...",
      "Etapa 4 de 4 · Preparando resultados"
    );

    $("summary").textContent =
      `${parts.length} partes · ${formatTime(duration)} en total`;

    $("parts").innerHTML = "";

    for (const part of parts) {
      const url = URL.createObjectURL(
        new Blob([part.data], { type: "video/mp4" })
      );

      const div = document.createElement("div");
      div.className = "part";

      const title = document.createElement("strong");
      title.textContent =
        `${part.name} · ${formatTime(part.duration)}`;

      const link = document.createElement("a");
      link.href = url;
      link.download = part.name;
      link.textContent = "Descargar video";

      div.append(title, link);
      $("parts").appendChild(div);
    }

    $("results").hidden = false;

    updateProgress(
      100,
      "¡Proceso completado! Tus videos están listos.",
      "Completado · Todas las partes generadas"
    );

    addLog("Proceso terminado correctamente.");

  } catch (error) {
    console.error(error);

    $("status").textContent =
      "Ocurrió un error durante el procesamiento:\n" +
      (error?.message || error);

    $("stage").textContent = "Proceso interrumpido";
    addLog("Error: " + (error?.message || error));

  } finally {
    currentTask = null;
    $("cut").disabled = false;
    $("video").disabled = false;
  }
});

$("downloadAll").addEventListener("click", async () => {
  try {
    $("downloadAll").disabled = true;

    const zip = new JSZip();

    for (const part of parts) {
      zip.file(part.name, part.data);
    }

    updateProgress(
      95,
      "Comprimiendo los videos en un ZIP...",
      "Preparando descarga"
    );

    const blob = await zip.generateAsync(
      { type: "blob" },
      metadata => {
        updateProgress(
          95 + metadata.percent * 0.05,
          `Comprimiendo ZIP: ${Math.round(metadata.percent)}%`,
          "Preparando descarga"
        );
      }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "historias_divididas.zip";
    link.click();

    updateProgress(
      100,
      "ZIP listo. Revisa tus descargas.",
      "Descarga preparada"
    );

    setTimeout(() => URL.revokeObjectURL(url), 10000);

  } catch (error) {
    $("status").textContent =
      "No se pudo preparar el ZIP: " + error.message;

  } finally {
    $("downloadAll").disabled = false;
  }
});
</script>
</body>
</html>
