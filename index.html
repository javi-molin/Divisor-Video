
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>Cortador de historias</title>

<style>
:root {
  --bg: #111116;
  --card: #1d1d25;
  --text: #f5f5f7;
  --muted: #aaaab8;
  --accent: #b9a0ff;
  --border: #353541;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 16px;
  padding-bottom: env(safe-area-inset-bottom, 25px);
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 { font-size: 27px; margin-bottom: 8px; }

p {
  color: var(--muted);
  line-height: 1.5;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}

input[type=file] {
  width: 100%;
  margin: 18px 0;
  color: var(--muted);
}

button {
  background: var(--accent);
  color: #17121f;
  border: 0;
  padding: 14px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  -webkit-appearance: none;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

button.secondary {
  background: #353541;
  color: white;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  background: black;
}

progress {
  width: 100%;
  height: 12px;
  margin-top: 14px;
  accent-color: var(--accent);
}

#stage {
  color: var(--accent);
  font-size: 13px;
  margin-top: 15px;
}

#percent {
  display: block;
  text-align: right;
  font-size: 14px;
  font-weight: bold;
  margin-top: 5px;
}

#status {
  margin-top: 12px;
  font-size: 14px;
  white-space: pre-wrap;
  line-height: 1.5;
}

#log {
  margin-top: 12px;
  font-size: 11px;
  color: var(--muted);
  max-height: 100px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.part {
  border-top: 1px solid var(--border);
  padding: 16px 0;
}

.part strong { display: block; }

.part a {
  display: inline-block;
  color: var(--accent);
  margin-top: 10px;
  padding: 8px 0;
  font-weight: 600;
}

.small { font-size: 12px; }

#results { margin-bottom: 25px; }

#retry { display: none; }

</style>
</head>

<body>
<main>

<h1>✂️ Cortador de historias</h1>

<p>
Divide videos largos en clips de un minuto, manteniendo el orden
y todo el contenido original. Optimizado para Safari en iPhone.
</p>

<section class="card">

  <label for="video"><strong>Selecciona tu video</strong></label>

  <input id="video" type="file" accept="video/*">

  <video id="preview" controls playsinline hidden></video>

  <p id="duration"></p>

  <button id="cut" disabled>Dividir video</button>

  <button id="retry" class="secondary">
    Reintentar carga del procesador
  </button>

  <div id="stage"></div>

  <progress id="progress" value="0" max="100" hidden></progress>

  <span id="percent"></span>

  <div id="status"></div>

  <div id="log"></div>

</section>

<section id="results" class="card" hidden>

  <h2>¡Videos listos!</h2>

  <p id="summary"></p>

  <div id="parts"></div>

</section>

<p class="small">
Mantén Safari abierto durante el procesamiento. Los videos se
procesan localmente y no se envían a ningún servidor.
</p>

</main>

<script type="module">

import { FFmpeg } from
"https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import { fetchFile } from
"https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js";

const $ = id => document.getElementById(id);

const PACKAGE =
"https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/";

const CORE =
"https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd/";

let ffmpeg = null;
let selectedFile = null;
let duration = 0;
let busy = false;
let loading = false;
let outputURLs = [];
let workerBlobURL = null;
let coreBlobURL = null;
let wasmBlobURL = null;

// ------------------------------------
// INTERFAZ Y PROGRESO
// ------------------------------------

function setProgress(percent, stage, message) {

  $("progress").hidden = false;
  $("progress").value = percent;

  $("percent").textContent =
    Math.round(percent) + "%";

  $("stage").textContent = stage;
  $("status").textContent = message;
}

function setLoading(stage, message) {

  $("progress").hidden = false;
  $("progress").removeAttribute("value");

  $("percent").textContent = "Cargando...";
  $("stage").textContent = stage;
  $("status").textContent = message;
}

function log(message) {

  const time = new Date().toLocaleTimeString();

  $("log").textContent +=
    `[${time}] ${message}\n`;

  $("log").scrollTop = $("log").scrollHeight;
}

function formatTime(seconds) {

  const s = Math.floor(seconds);

  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

// ------------------------------------
// DESCARGA CON PROGRESO REAL
// ------------------------------------

async function downloadBlob(url, type, start, end, label) {

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(
      `No se pudo descargar ${label}: HTTP ${response.status}`
    );
  }

  const total = Number(
    response.headers.get("Content-Length")
  );

  if (!response.body) {
    throw new Error(
      "Safari no pudo iniciar la descarga de " + label
    );
  }

  const reader = response.body.getReader();

  const chunks = [];
  let received = 0;

  while (true) {

    const { done, value } = await reader.read();

    if (done) break;

    chunks.push(value);
    received += value.length;

    if (total > 0) {

      const ratio = received / total;

      setProgress(
        start + ratio * (end - start),
        "Etapa 1 · Descargando FFmpeg",
        `${label}: ${(received / 1024 / 1024).toFixed(1)} MB de ${(total / 1024 / 1024).toFixed(1)} MB`
      );

    } else {

      setLoading(
        "Etapa 1 · Descargando FFmpeg",
        `${label}: ${(received / 1024 / 1024).toFixed(1)} MB descargados`
      );

    }
  }

  return URL.createObjectURL(
    new Blob(chunks, { type })
  );
}

// ------------------------------------
// CREAR WORKER COMPATIBLE CON SAFARI
// ------------------------------------

async function createLocalWorker() {

  setLoading(
    "Etapa 1 · Preparando Worker",
    "Descargando el archivo del procesador..."
  );

  const response = await fetch(
    PACKAGE + "worker.js"
  );

  if (!response.ok) {
    throw new Error("No se pudo descargar worker.js");
  }

  let source = await response.text();

  // Reescribir las importaciones relativas del Worker
  // para que apunten al paquete oficial.
  source = source.replace(
    /((?:from|import)\s*)["']\.\/([^"']+)["']/g,
    (_, prefix, filename) =>
      `${prefix}"${PACKAGE}${filename}"`
  );

  const blob = new Blob(
    [source],
    { type: "text/javascript" }
  );

  workerBlobURL = URL.createObjectURL(blob);

  log("Worker preparado en una dirección local.");

}

// ------------------------------------
// CARGAR FFMPEG
// ------------------------------------

async function loadFFmpeg() {

  if (ffmpeg?.loaded) return;

  if (loading) {
    throw new Error("La carga ya está en curso.");
  }

  loading = true;

  $("retry").style.display = "none";

  try {

    log("Comenzando carga de FFmpeg.");

    await createLocalWorker();

    setProgress(
      5,
      "Etapa 1 · Descargando FFmpeg",
      "Descargando motor principal..."
    );

    coreBlobURL = await downloadBlob(
      CORE + "ffmpeg-core.js",
      "text/javascript",
      5,
      15,
      "Motor JavaScript"
    );

    wasmBlobURL = await downloadBlob(
      CORE + "ffmpeg-core.wasm",
      "application/wasm",
      15,
      85,
      "Motor WebAssembly"
    );

    setProgress(
      88,
      "Etapa 1 · Inicializando",
      "Preparando el procesador de video..."
    );

    ffmpeg = new FFmpeg();

    ffmpeg.on("log", ({ message }) => {

      if (message) log(message);

    });

    await ffmpeg.load({

      classWorkerURL: workerBlobURL,

      coreURL: coreBlobURL,

      wasmURL: wasmBlobURL

    });

    setProgress(
      100,
      "Etapa 1 · Completada",
      "¡Procesador de video listo!"
    );

    log("FFmpeg inicializado correctamente.");

  } finally {

    loading = false;

  }
}

// ------------------------------------
// SELECCIONAR VIDEO
// ------------------------------------

$("video").addEventListener("change", async event => {

  selectedFile = event.target.files[0];

  if (!selectedFile) return;

  $("results").hidden = true;
  $("cut").disabled = true;
  $("retry").style.display = "none";

  $("log").textContent = "";

  const url = URL.createObjectURL(selectedFile);

  $("preview").src = url;
  $("preview").hidden = false;

  try {

    await new Promise((resolve, reject) => {

      $("preview").onloadedmetadata = resolve;
      $("preview").onerror = reject;

    });

    duration = $("preview").duration;

    $("duration").textContent =
      `Duración: ${formatTime(duration)} · ` +
      `${Math.ceil(duration / 60)} partes`;

    $("cut").disabled = false;

    $("status").textContent =
      "Video cargado correctamente.";

    $("stage").textContent = "";

  } catch {

    $("status").textContent =
      "No se pudo leer el video.";

  }

});

// ------------------------------------
// BOTÓN DE REINTENTO
// ------------------------------------

$("retry").addEventListener("click", async () => {

  $("retry").style.display = "none";
  $("cut").disabled = true;

  try {

    await loadFFmpeg();

    $("cut").disabled = false;

  } catch (error) {

    $("status").textContent =
      "Error al cargar FFmpeg:\n" + error.message;

    $("retry").style.display = "block";

    log(error.message);

  }

});

// ------------------------------------
// DIVIDIR VIDEO
// ------------------------------------

$("cut").addEventListener("click", async () => {

  if (busy || !selectedFile) return;

  busy = true;

  $("cut").disabled = true;
  $("video").disabled = true;
  $("results").hidden = true;
  $("retry").style.display = "none";

  // Liberar enlaces de resultados anteriores
  outputURLs.forEach(url => URL.revokeObjectURL(url));
  outputURLs = [];

  $("parts").innerHTML = "";
  $("log").textContent = "";

  try {

    // 1. Cargar procesador
    await loadFFmpeg();

    // 2. Preparar archivo
    setProgress(
      0,
      "Etapa 2 · Preparando video",
      "Leyendo archivo..."
    );

    const extension =
      selectedFile.name.split(".").pop().toLowerCase()
        .replace(/[^a-z0-9]/g, "") || "mp4";

    const input = `original.${extension}`;

    const fileData = await fetchFile(selectedFile);

    setProgress(
      5,
      "Etapa 2 · Preparando video",
      "Copiando video al procesador..."
    );

    await ffmpeg.writeFile(input, fileData);

    log("Archivo cargado en FFmpeg.");

    // 3. Dividir
    const total = Math.ceil(duration / 60);

    const parts = [];

    for (let i = 0; i < total; i++) {

      const start = i * 60;

      const length = Math.min(
        60,
        duration - start
      );

      const filename =
        `parte_${String(i + 1).padStart(2, "0")}.mp4`;

      const base = (i / total) * 100;
      const weight = 100 / total;

      setProgress(
        base,
        `Etapa 3 · Parte ${i + 1} de ${total}`,
        `Procesando desde ${formatTime(start)} · Duración ${formatTime(length)}`
      );

      // Buscar progreso de codificación
      const progressHandler = ({ progress }) => {

        if (!Number.isFinite(progress)) return;

        const ratio = Math.max(
          0,
          Math.min(1, progress)
        );

        setProgress(
          base + ratio * weight,
          `Etapa 3 · Parte ${i + 1} de ${total}`,
          `Codificando parte ${i + 1}...`
        );

      };

      ffmpeg.on("progress", progressHandler);

      try {

        const exitCode = await ffmpeg.exec([

          "-i", input,

          "-ss", String(start),

          "-t", String(length),

          "-map", "0:v:0",

          "-map", "0:a:0?",

          "-c:v", "libx264",

          "-preset", "ultrafast",

          "-crf", "23",

          "-c:a", "aac",

          "-b:a", "128k",

          "-movflags", "+faststart",

          filename

        ]);

        if (exitCode !== 0) {
          throw new Error(
            `Falló la codificación de la parte ${i + 1}.`
          );
        }

      } finally {

        ffmpeg.off("progress", progressHandler);

      }

      const output = await ffmpeg.readFile(filename);

      const blob = new Blob(
        [output],
        { type: "video/mp4" }
      );

      const url = URL.createObjectURL(blob);

      outputURLs.push(url);

      parts.push({
        name: filename,
        url,
        duration: length
      });

      await ffmpeg.deleteFile(filename);

      setProgress(
        ((i + 1) / total) * 100,
        `Etapa 3 · Parte ${i + 1} de ${total}`,
        `Parte ${i + 1} completada correctamente.`
      );

      log(`Generada ${filename}`);

    }

    // 4. Liberar archivo original de la memoria virtual
    await ffmpeg.deleteFile(input);

    // 5. Mostrar descargas
    setProgress(
      100,
      "Etapa 4 · Finalizado",
      "¡Todos los videos están listos!"
    );

    $("summary").textContent =
      `${parts.length} clips generados · ${formatTime(duration)} en total.`;

    for (const part of parts) {

      const div = document.createElement("div");

      div.className = "part";

      const title = document.createElement("strong");

      title.textContent =
        `${part.name} · ${formatTime(part.duration)}`;

      const link = document.createElement("a");

      link.href = part.url;
      link.download = part.name;
      link.textContent = "⬇ Descargar video";

      div.append(title, link);

      $("parts").appendChild(div);

    }

    $("results").hidden = false;

    log("Proceso terminado correctamente.");

  } catch (error) {

    console.error(error);

    $("status").textContent =
      "Ocurrió un error:\n" +
      (error.message || String(error));

    $("stage").textContent =
      "Proceso interrumpido";

    $("retry").style.display = "block";

    log("ERROR: " + error.message);

  } finally {

    busy = false;

    $("cut").disabled = false;
    $("video").disabled = false;

  }

});

// ------------------------------------
// LIMPIEZA AL SALIR
// ------------------------------------

window.addEventListener("pagehide", () => {

  outputURLs.forEach(url => URL.revokeObjectURL(url));

  if (workerBlobURL) {
    URL.revokeObjectURL(workerBlobURL);
  }

  if (coreBlobURL) {
    URL.revokeObjectURL(coreBlobURL);
  }

  if (wasmBlobURL) {
    URL.revokeObjectURL(wasmBlobURL);
  }

});

</script>
</body>
</html>
