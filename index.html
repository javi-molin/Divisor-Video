
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortador de historias</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #111116;
  color: #f5f5f7;
  font-family: system-ui, sans-serif;
}

main { max-width: 600px; margin: auto; }

h1 { font-size: 26px; }

p { color: #aaaab8; line-height: 1.5; }

.card {
  background: #1d1d25;
  border: 1px solid #353541;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}

input[type=file] {
  width: 100%;
  margin: 18px 0;
}

button {
  background: #b9a0ff;
  color: #17121f;
  border: 0;
  padding: 14px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

button:disabled { opacity: .4; }

progress {
  width: 100%;
  height: 12px;
  margin-top: 14px;
  accent-color: #b9a0ff;
}

#status {
  margin-top: 15px;
  font-size: 14px;
  white-space: pre-wrap;
}

#stage {
  color: #b9a0ff;
  font-size: 13px;
  margin-top: 12px;
}

#percent {
  display: block;
  text-align: right;
  font-size: 14px;
  margin-top: 5px;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
}

.part {
  border-top: 1px solid #353541;
  padding: 16px 0;
}

.part a {
  color: #b9a0ff;
  display: inline-block;
  margin-top: 10px;
}

.small { font-size: 12px; }
</style>
</head>

<body>
<main>
<h1>✂️ Cortador de historias</h1>

<p>
Divide videos largos en clips de un minuto, sin repetir ni
perder escenas. Todo se procesa en tu dispositivo.
</p>

<section class="card">
  <label for="video"><strong>Selecciona tu video</strong></label>
  <input id="video" type="file" accept="video/*">

  <video id="preview" controls hidden></video>
  <p id="duration"></p>

  <button id="cut" disabled>Dividir video</button>
  <button id="retry" hidden>Reintentar carga</button>

  <div id="stage"></div>
  <progress id="progress" value="0" max="100" hidden></progress>
  <span id="percent"></span>
  <div id="status"></div>
</section>

<section id="results" class="card" hidden>
  <h2>Videos listos</h2>
  <p id="summary"></p>
  <div id="parts"></div>
</section>

<p class="small">
Mantén Safari abierto durante el procesamiento. Si el video es
muy largo, prueba dividirlo en tramos más pequeños.
</p>
</main>

<script type="module">
import { FFmpeg } from
  "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import { fetchFile, toBlobURL } from
  "https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js";

const $ = id => document.getElementById(id);

let ffmpeg;
let selectedFile;
let duration = 0;
let loading = false;
let busy = false;

function status(message, stage, percent = null) {
  $("status").textContent = message;
  $("stage").textContent = stage;

  $("progress").hidden = false;

  if (percent === null) {
    $("progress").removeAttribute("value");
    $("percent").textContent = "Preparando...";
  } else {
    $("progress").value = percent;
    $("percent").textContent = Math.round(percent) + "%";
  }
}

function formatTime(seconds) {
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

async function loadFFmpeg() {
  if (ffmpeg?.loaded) return;

  if (loading) throw new Error("La carga ya está en curso.");

  loading = true;
  $("retry").hidden = true;

  try {
    status(
      "Descargando el procesador de video. La primera carga puede tardar.",
      "Etapa 1 de 3 · Descargando FFmpeg"
    );

    ffmpeg = new FFmpeg();

    // Archivos de la misma versión para evitar incompatibilidades.
    const base =
      "https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd/";

    status(
      "Preparando el motor de video...",
      "Etapa 1 de 3 · Inicializando FFmpeg"
    );

    await ffmpeg.load({
      coreURL: await toBlobURL(
        base + "ffmpeg-core.js",
        "text/javascript"
      ),
      wasmURL:
        base + "ffmpeg-core.wasm"
    });

    status(
      "Procesador listo.",
      "Etapa 1 de 3 · Completada",
      100
    );

  } finally {
    loading = false;
  }
}

$("video").addEventListener("change", async event => {
  selectedFile = event.target.files[0];

  if (!selectedFile) return;

  $("results").hidden = true;
  $("cut").disabled = true;
  $("retry").hidden = true;

  $("preview").src = URL.createObjectURL(selectedFile);
  $("preview").hidden = false;

  await new Promise(resolve => {
    $("preview").onloadedmetadata = resolve;
  });

  duration = $("preview").duration;

  $("duration").textContent =
    `Duración: ${formatTime(duration)} · ` +
    `${Math.ceil(duration / 60)} partes`;

  $("cut").disabled = false;
  $("status").textContent = "";
  $("stage").textContent = "";
  $("progress").hidden = true;
});

$("retry").addEventListener("click", async () => {
  $("retry").hidden = true;
  $("cut").disabled = true;

  try {
    await loadFFmpeg();
    $("cut").disabled = false;
  } catch (error) {
    $("status").textContent =
      "No se pudo cargar FFmpeg. Revisa tu conexión e inténtalo otra vez.";

    $("retry").hidden = false;
  }
});

$("cut").addEventListener("click", async () => {
  if (busy || !selectedFile) return;

  busy = true;
  $("cut").disabled = true;
  $("video").disabled = true;
  $("results").hidden = true;

  try {
    await loadFFmpeg();

    status(
      "Leyendo el archivo de video...",
      "Etapa 2 de 3 · Preparando archivo",
      0
    );

    await ffmpeg.writeFile(
      "original.mp4",
      await fetchFile(selectedFile)
    );

    const total = Math.ceil(duration / 60);
    const parts = [];

    for (let i = 0; i < total; i++) {
      const start = i * 60;
      const length = Math.min(60, duration - start);

      const name =
        `parte_${String(i + 1).padStart(2, "0")}.mp4`;

      status(
        `Procesando parte ${i + 1} de ${total}...`,
        "Etapa 3 de 3 · Dividiendo video",
        (i / total) * 100
      );

      await ffmpeg.exec([
        "-ss", String(start),
        "-i", "original.mp4",
        "-t", String(length),
        "-map", "0:v:0",
        "-map", "0:a:0?",
        "-c:v", "libx264",
        "-preset", "ultrafast",
        "-crf", "23",
        "-c:a", "aac",
        "-b:a", "128k",
        "-movflags", "+faststart",
        name
      ]);

      const output = await ffmpeg.readFile(name);

      const blob = new Blob(
        [output],
        { type: "video/mp4" }
      );

      // Guardamos el clip como un objeto descargable.
      const url = URL.createObjectURL(blob);

      parts.push({ name, url, duration: length });

      // Liberamos el archivo temporal de FFmpeg.
      await ffmpeg.deleteFile(name);

      status(
        `Parte ${i + 1} de ${total} completada.`,
        "Etapa 3 de 3 · Dividiendo video",
        ((i + 1) / total) * 100
      );
    }

    await ffmpeg.deleteFile("original.mp4");

    $("summary").textContent =
      `${parts.length} partes · ${formatTime(duration)} en total`;

    $("parts").innerHTML = "";

    for (const part of parts) {
      const div = document.createElement("div");
      div.className = "part";

      const title = document.createElement("strong");
      title.textContent =
        `${part.name} · ${formatTime(part.duration)}`;

      const link = document.createElement("a");
      link.href = part.url;
      link.download = part.name;
      link.textContent = "Descargar parte";

      div.append(title, link);
      $("parts").appendChild(div);
    }

    $("results").hidden = false;

    status(
      "¡Video dividido correctamente!",
      "Completado",
      100
    );

  } catch (error) {
    console.error(error);

    status(
      "Ocurrió un error: " + error.message,
      "Proceso interrumpido"
    );

    $("retry").hidden = false;

  } finally {
    busy = false;
    $("cut").disabled = false;
    $("video").disabled = false;
  }
});
</script>
</body>
</html>
